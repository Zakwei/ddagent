<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ddagent_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ddagent_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #ddagent-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #faf9f7; color: #666;
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
    }
    #ddagent-loading .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid #ddd; border-top-color: #0175C2;
      animation: ddagent-spin 0.9s linear infinite;
    }
    @keyframes ddagent-spin { to { transform: rotate(360deg); } }
    #ddagent-boot-error {
      position: fixed; inset: 0; margin: 0; padding: 24px; z-index: 9999;
      background: #fff; color: #b00020; overflow: auto;
      font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="ddagent-loading"><div class="spinner"></div><div>Loading…</div></div>
  <script>
    // Never leave a silent white page: surface boot errors, drop the spinner
    // on first frame, and nudge the user if loading stalls.
    (function () {
      var started = false;
      var loading = document.getElementById('ddagent-loading');

      function showError(text) {
        if (started) return;
        var el = document.getElementById('ddagent-boot-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'ddagent-boot-error';
          document.body.appendChild(el);
        }
        el.textContent = 'ddagent failed to start.\n\n' + text +
          '\n\nTry a full reload, or clear site data and retry.';
      }

      window.addEventListener('flutter-first-frame', function () {
        started = true;
        if (loading) loading.remove();
      });

      // capture=true also catches resource load failures (script/wasm 404s)
      window.addEventListener('error', function (e) {
        showError(e.message ||
          (e.target && (e.target.src || e.target.href)
            ? 'Failed to load: ' + (e.target.src || e.target.href)
            : 'Unknown startup error'));
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showError((r && (r.stack || r.message)) || String(r));
      });

      setTimeout(function () {
        if (!started && loading) {
          var hint = document.createElement('div');
          hint.textContent = 'Still loading — slow connection or blocked storage (private mode?).';
          loading.appendChild(hint);
        }
      }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
