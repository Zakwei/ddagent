# Strict analysis config for the ddagent Flutter rebuild.
# Formatting is enforced in CI via `dart format --set-exit-if-changed` (line length 100).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated-code drift and dead code are CI failures, not warnings.
    dead_code: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    # Stricter than flutter_lints defaults — keep diffs clean and uniform.
    - always_declare_return_types
    - always_use_package_imports
    - avoid_catches_without_on_clauses
    - avoid_double_and_int_checks
    - avoid_multiple_declarations_per_line
    - avoid_unnecessary_containers
    - directives_ordering
    - eol_at_end_of_file
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
