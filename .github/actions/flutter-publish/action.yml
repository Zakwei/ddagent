name: Publish Flutter artifacts
description: >-
  Upload the per-platform artifacts from release/flutter/ (in the repo root)
  onto the draft GitHub release for a v* tag, or as Actions artifacts on
  manual runs.

inputs:
  name:
    description: Artifact name suffix for manual (non-tag) runs.
    required: true

runs:
  using: composite
  steps:
    - name: Publish to GitHub release
      if: github.ref_type == 'tag'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="$GITHUB_REF_NAME"
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
          || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$TAG" --notes-file scripts/release/release-notes-template.md
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/flutter/*

    - if: github.ref_type != 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: ddagent-flutter-${{ inputs.name }}-${{ github.ref_name }}
        path: release/flutter/
        if-no-files-found: error
