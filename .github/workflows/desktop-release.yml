name: Desktop release

# Builds the Electron desktop app for macOS/Windows/Linux on release tags
# (v*) and on manual dispatch.
#
# Publish flow: electron-builder runs `--publish onTag` — on tag builds
# (GITHUB_REF_TYPE=tag) it creates a GitHub DRAFT release named
# `v<package.json version>` and uploads every artifact plus the
# latest{,-mac,-linux}.yml files electron-updater's GitHub feed needs. The
# draft body is pre-filled from scripts/release/release-notes-template.md
# (per-locale `<!-- lang:xx -->` sections — AGENTS.md requires notes for all
# 12 UI locales; fill each in, then publish the draft on GitHub). Non-tag
# builds (workflow_dispatch on a branch) never publish — installers are only
# attached to the workflow run via actions/upload-artifact below.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `contents: write` — electron-builder creates the draft release and uploads
# assets through GH_TOKEN (the auto-provided GITHUB_TOKEN) on tag builds.
permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other artifact builds.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            builder-args: --mac dmg
            artifact-suffix: macos
          - name: Windows
            os: windows-latest
            builder-args: --win nsis
            artifact-suffix: windows
          - name: Linux
            os: ubuntu-latest
            builder-args: --linux # AppImage + deb come from the build config targets
            artifact-suffix: linux
    env:
      # Optional secrets — the build never fails when they are absent:
      #   CSC_LINK / CSC_KEY_PASSWORD      codesign cert (mac + win)
      #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  macOS notarize
      # macOS still attempts identity discovery with CSC_LINK unset — the
      # probe step below exports CSC_IDENTITY_AUTO_DISCOVERY=false in that
      # case; macOS notarize is additionally gated off because it is `true`
      # in the packaged build config.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # electron-builder `--publish onTag` uses this to create the draft
      # release and upload assets. The auto-provided GITHUB_TOKEN is enough —
      # a PAT is only needed if releases should trigger other workflows.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # README floor: Node.js 22+
          cache: npm

      # electron-builder names the GH release `v` + package.json version, not
      # the pushed git tag — a mismatched tag would silently publish
      # v<package.json> under the wrong ref. Bump via `npm run release:desktop`
      # so tag and version can never diverge.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($PKG_TAG) — bump via 'npm run release:desktop -- <x.y.z>'"
            exit 1
          fi

      - run: npm ci

      # .env (with VITE_IS_PLATFORM=true) is gitignored — without it vite emits
      # an OSS-mode bundle whose WebSocketProvider waits for a login token that
      # embedded local mode never supplies (app stalls on the login screen,
      # bundled /ws socket never opens). Pin the flag so CI artifacts match
      # what local builds produce.
      - run: npm run build
        env:
          VITE_IS_PLATFORM: 'true'

      # npm ci installs natives for the NODE ABI; the smoke boots the real
      # Electron main which needs the Electron ABI (better_sqlite3 NODE_MODULE_VERSION
      # 127 vs 139 mismatch otherwise). Rebuild them in-place for the smoke —
      # electron-builder's npmRebuild re-rebuilds for the pack anyway.
      - name: Rebuild natives for Electron ABI
        if: matrix.os == 'ubuntu-latest'
        # -o/--only is last-wins, not repeatable — one invocation per module.
        run: |
          npx electron-rebuild -f -o better-sqlite3
          npx electron-rebuild -f -o node-pty
          npx electron-rebuild -f -o bcrypt

      # Headless in-proc E2E (task 10.7): boots the real Electron main +
      # embedded backend under ozone/headless and asserts REST/WS/SW/assets.
      # Linux-only — the smoke uses `ss`/`ps` and ozone headless flags;
      # ubuntu runners ship both. Cheap (~1-2 min) since the build is done.
      - name: Headless desktop smoke (in-proc E2E)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:desktop

      - name: Stage desktop app
        run: node scripts/release/prepare-desktop-app.js

      # Secrets cannot be read in `if:` — probe them in a step and gate on its
      # output. Full macOS sign+notarize requires a codesign cert (CSC_LINK)
      # AND Apple notary credentials.
      - name: Probe Apple signing secrets
        id: apple
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets absent — producing unsigned, unnotarized dmg"
            # macOS builds sign by default — unlike win/linux, unset CSC_LINK
            # does NOT skip signing; app-builder walks the cert path anyway and
            # dies with '<projectDir> not a file'. Explicitly opting out of
            # identity discovery yields a plain adhoc-signed (unsigned) app.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      # mac.notarize is `true` in the staged package.json; notarizing an
      # unsigned app or without Apple creds fails — patch it off instead of
      # forking the whole config.
      - name: Disable notarization when secrets are absent
        if: matrix.os == 'macos-latest' && steps.apple.outputs.ready == 'false'
        run: |
          node -e "const fs=require('fs');const f='.desktop-build/desktop-app/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.build.mac.notarize=false;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n');console.log('mac.notarize disabled');"

      # Windows signing: CSC_LINK unset → the NSIS installer ships unsigned
      # and SmartScreen shows "Windows protected your PC" on first install
      # (More info → Run anyway still works; reputation builds over time).
      # To enable signing later: base64-encode a code-signing .pfx into the
      # CSC_LINK repo secret and its password into CSC_KEY_PASSWORD —
      # electron-builder picks both up automatically, no workflow edit needed.
      # Absent secrets interpolate as EMPTY strings, not "unset" — and
      # electron-builder reads an empty CSC_LINK as a certificate file path,
      # failing with '<projectDir> not a file' (upstream issue, fixed for
      # cscLink config but still applies to env). Truly unset them here.
      # bash is available on all three runners (Git Bash on Windows).
      - name: electron-builder
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder --projectDir .desktop-build/desktop-app ${{ matrix.builder-args }} --publish onTag

      # Tag builds upload their installers straight onto the GitHub release
      # via `--publish onTag` — artifacts would only duplicate ~800MB/run
      # into Actions storage quota. Keep them for manual (branch) builds.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        continue-on-error: true # storage-quota exhaustion must not fail a verification build
        with:
          name: ddagent-desktop-${{ matrix.artifact-suffix }}-${{ github.ref_name }}
          path: release/desktop/
          if-no-files-found: error
