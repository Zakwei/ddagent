name: Server release

# Builds the server tarball on release tags (v*) and on manual dispatch,
# publishing it onto the per-version GitHub draft release:
#
#   release/server/ddagent-server-<version>-<platform>-<arch>.tar.gz (+ .sha256)
#     STANDALONE self-hosted server — Node 22+, serves the REST/WS API that
#     the Flutter client connects to remotely. Built by
#     `DDAGENT_BUNDLE_VARIANT=standalone node
#     scripts/release/build-server-bundle.js`.
#
#   install.sh — descriptive alternative to the tarballs: clones the tag,
#   npm ci, builds, prunes devDeps (works on any platform/arch, incl. ones
#   without a prebuilt tarball). Uploaded with the bundles above.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `contents: write` — the publish step below creates the draft release (if
# the desktop job has not already) and uploads assets through GH_TOKEN (the
# auto-provided GITHUB_TOKEN) on tag builds.
permissions:
  contents: write

jobs:
  server:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other artifact builds.
      fail-fast: false
      matrix:
        # Add `os: ubuntu-24.04-arm` later for linux-arm64 standalone
        # builds — arm runners are billed on private repos.
        include:
          - name: Linux
            os: ubuntu-latest
            artifact-suffix: linux-x64
          - name: macOS
            os: macos-latest
            artifact-suffix: macos-arm64
          - name: Windows
            os: windows-latest
            artifact-suffix: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # README floor: Node.js 22+
          cache: npm

      # The GH release is named `v` + package.json version, not the pushed git
      # tag — a mismatched tag would silently publish v<package.json> under the
      # wrong ref. Bump via `npm run release` so tag and version can never
      # diverge.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($PKG_TAG) — bump via 'npm run release -- <x.y.z>'"
            exit 1
          fi

      # GITHUB_TOKEN here is for @vscode/ripgrep's postinstall, which resolves
      # its binary through the GitHub API — anonymous calls from runners hit
      # secondary rate limits and fail npm ci with a 403.
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      # STANDALONE self-hosted server tarball → release/server/.
      - name: Build standalone server bundle
        run: node scripts/release/build-server-bundle.js
        env:
          DDAGENT_BUNDLE_VARIANT: standalone

      # `gh release create` creates the draft release; the notes-file pre-fills
      # the draft body with the per-locale template. --clobber makes re-runs
      # idempotent.
      - name: Publish bundles to GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes-file scripts/release/release-notes-template.md
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            install.sh \
            release/server/*.tar.gz release/server/*.sha256

      # Tag builds upload their tarballs straight onto the GitHub release —
      # keep Actions artifacts only for manual (branch) builds.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        continue-on-error: true # storage-quota exhaustion must not fail a verification build
        with:
          name: ddagent-server-${{ matrix.artifact-suffix }}-${{ github.ref_name }}
          path: release/server/
          if-no-files-found: error
