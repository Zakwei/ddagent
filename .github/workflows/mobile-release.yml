name: Mobile release

# WIP / skeleton — the Expo mobile app (mobile/, EAS projectId in
# mobile/app.json, owner ddnet-dw) is still in development; this workflow
# is manual-only until mobile ships. Requires the repo secret EXPO_TOKEN
# (Expo access token). When mobile joins releases: add a tag trigger
# (e.g. 'mobile-v*') and/or upload the APK/AAB onto the shared v* release
# like server-release.yml does.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile from mobile/eas.json — preview=APK internal, production=AAB
        type: choice
        options:
          - preview
          - production
        default: preview

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # README floor: Node.js 22+
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Set the EXPO_TOKEN repo secret (Expo access token) to build mobile."
            exit 1
          fi

      # GITHUB_TOKEN here is for @vscode/ripgrep's postinstall, which resolves
      # its binary through the GitHub API — anonymous calls from runners hit
      # secondary rate limits and fail npm ci with a 403.
      - run: npm ci --prefix mobile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm --prefix mobile run test && npm --prefix mobile run typecheck

      # eas.json pins cli >=16; --wait blocks until the cloud build finishes
      # and --json prints the artifact list.
      - name: EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@16 build -p android --profile "${{ inputs.profile }}" --non-interactive --wait --json > eas-build.json

      # EAS --json prints an array of build objects; the artifact URL lives
      # at [0].artifacts.buildUrl. Fall back to scanning the file for an
      # https URL ending in .apk/.aab if parsing fails.
      - name: Download artifact
        id: artifact
        working-directory: mobile
        shell: bash
        run: |
          URL="$(node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("eas-build.json", "utf8");
            try {
              const builds = JSON.parse(raw);
              const url = builds && builds[0] && builds[0].artifacts && builds[0].artifacts.buildUrl;
              if (url) { console.log(url); process.exit(0); }
            } catch (e) {}
            const m = raw.match(/https:\/\/\S+?\.(apk|aab)/);
            if (m) { console.log(m[0]); process.exit(0); }
            process.exit(1);
          ')"
          BASE="${URL%%\?*}"
          EXT="${BASE##*.}"
          OUT="ddagent-mobile-${{ inputs.profile }}.${EXT}"
          curl -L --fail -o "$OUT" "$URL"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ddagent-mobile-${{ inputs.profile }}-${{ github.ref_name }}
          path: mobile/${{ steps.artifact.outputs.file }}
          if-no-files-found: error
